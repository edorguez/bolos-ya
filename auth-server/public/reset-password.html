<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abriendo Merki...</title>
</head>
<body style="margin:0;padding:0;background:#fbfaf9;color:#474645;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
  <div style="text-align:center;max-width:360px;">
    <p style="font-size:15px;line-height:1.47;">Abriendo Merki...</p>
    <a id="fallback" href="merki://reset-password" style="display:inline-block;margin-top:16px;color:#ff3e00;font-size:14px;font-weight:500;text-decoration:none;">Si la app no se abre, toca aquí</a>
  </div>
  <script>
    (function () {
      var token = new URLSearchParams(window.location.search).get('token');
      var deepLink = 'merki://reset-password?token=' + encodeURIComponent(token);
      document.getElementById('fallback').href = deepLink;
      window.location.href = deepLink;
    })();
  </script>
</body>
</html>
