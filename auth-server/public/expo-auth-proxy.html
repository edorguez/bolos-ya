<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta id="refresh" http-equiv="refresh" content="0">
  <title>Redirigiendo...</title>
</head>
<body style="margin:0;padding:0;background:#121212;color:#ffffff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">
  <p style="font-size:15px;">Redirigiendo...</p>
  <script>
    (function () {
      var authorizationURL = new URLSearchParams(window.location.search).get('authorizationURL');
      if (authorizationURL) {
        document.getElementById('refresh').content = '1;url=' + encodeURI(authorizationURL);
        setTimeout(function () {
          window.location.href = authorizationURL;
        }, 800);
      }
    })();
  </script>
</body>
</html>
