openapi: 3.0.0
info:
  title: Merki API
  description: API for Merki - Supermarket cart calculator with dual currency support
  version: 1.0.0
  contact:
    name: Merki Team
    email: team@somosmerki.app
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api.somosmerki.app/api/v1
    description: Production server

paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
        "409":
          description: User already exists

  /auth/login:
    post:
      summary: Authenticate user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/internal/send-reset-password-email:
    post:
      summary: Send a password reset email (internal, auth-server to Go)
      description: >
        Sends the password reset email via Resend using the Go backend's email
        templates. Called by the auth-server (better-auth `sendResetPassword`
        hook). NOT intended for mobile clients. Authenticated with the shared
        INTERNAL_API_KEY secret.
      operationId: sendResetPasswordEmail
      security:
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset password email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid or missing internal API key
        "500":
          description: Failed to send email

  /sync:
    post:
      summary: Sync offline operations
      operationId: syncOperations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Sync processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "401":
          description: Unauthorized
        "409":
          description: Conflict detected

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        timestamp:
          type: integer
          format: int64
          example: 1678901234

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "secret123"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
        isPremium:
          type: boolean
          default: false
        isAnonymous:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/User"

    ForgotPasswordRequest:
      type: object
      required:
        - email
        - resetUrl
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          description: Display name of the user (falls back to email prefix)
          example: "Ana"
        resetUrl:
          type: string
          description: Full deep-link URL carrying the reset token
          example: "merki://reset-password?token=abc123"

    SimpleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: "email de restablecimiento enviado"

    SyncOperation:
      type: object
      properties:
        table:
          type: string
          enum: [cart_products, carts, prices]
        action:
          type: string
          enum: [INSERT, UPDATE, DELETE]
        payload:
          type: object
        timestamp:
          type: integer
          format: int64

    SyncRequest:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/SyncOperation"

    SyncResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              success:
                type: boolean
              error:
                type: string
              server_version:
                type: object

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: http
      scheme: bearer
      description: Shared INTERNAL_API_KEY secret used for auth-server to Go service calls
